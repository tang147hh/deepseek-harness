# Optional paste-in for 1Panel OpenResty (nginx). Not loaded by Compose.
# Do not `include` this file as-is: the two `location /` blocks belong to
# two different 1Panel websites (www vs pages).
# Pair with docker-compose.1panel.yml: www → 127.0.0.1:18080, pages → 18081.
# Do not start Compose Caddy while 1Panel owns 80/443.
#
# Intent matches platform/deploy/Caddyfile:
#   APP_HOST keeps Host = www.996-code.com (APP_HOST / dsh --trusted-host)
#   pages strips Cookie + Set-Cookie so dsh_session cannot leak onto user sites
#
# In 1Panel: Website → reverse proxy. Enable WebSocket on www.
# If the panel sets Host to $proxy_host / 127.0.0.1:18080, replace it.

# --- http {} once (1Panel often already has this when WebSocket is enabled) ---
# map $http_upgrade $connection_upgrade {
#     default upgrade;
#     ''      close;
# }

# --- www.996-code.com → control-plane (must Upgrade; Host stays public name) ---
# server_name www.996-code.com;
location / {
    proxy_pass http://127.0.0.1:18080;
    proxy_http_version 1.1;
    proxy_set_header Host www.996-code.com;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# --- pages.996-code.com + *.pages.996-code.com → pages (strip cookies) ---
# server_name pages.996-code.com *.pages.996-code.com;
# Host must be $host so pages can resolve slug from the subdomain.
location / {
    proxy_pass http://127.0.0.1:18081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_hide_header Set-Cookie;
    proxy_set_header Cookie "";
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
