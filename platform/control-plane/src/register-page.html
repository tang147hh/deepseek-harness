<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 52rem; margin: 1.5rem auto; padding: 0 1rem; }
    h1 { font-size: 1.25rem; }
    form, .row { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin: .75rem 0; }
    input[type=text], input[type=password] { min-width: 12rem; }
    .muted { color: #555; }
    .err { color: #a40000; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>注册</h1>
  <p class="muted">需要邀请码。第一个成功注册的用户是 <code>admin</code>。注册成功后进入 Agent UI。</p>
  <p><a href="/auth/login">已有账号？登录</a></p>
  <form id="register">
    <label>username <input type="text" name="username" required autocomplete="username"></label>
    <label>password <input type="password" name="password" required autocomplete="new-password"></label>
    <label>inviteCode <input type="text" name="inviteCode" required autocomplete="off"></label>
    <button type="submit">注册</button>
  </form>
  <p id="err" class="err"></p>
  <script>
    const errEl = document.getElementById("err");
    function showErr(t) { errEl.textContent = t || ""; }
    document.getElementById("register").onsubmit = async (ev) => {
      ev.preventDefault();
      showErr("");
      const fd = new FormData(ev.target);
      const res = await fetch("/auth/register", {
        method: "POST",
        credentials: "same-origin",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          username: fd.get("username"),
          password: fd.get("password"),
          inviteCode: fd.get("inviteCode"),
        }),
      });
      const text = await res.text();
      if (!res.ok) { showErr(res.status + " " + text); return; }
      location = "/";
    };
  </script>
</body>
</html>
